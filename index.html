/* Part 1 */
.opt{white-space:pre-wrap}

.uvb span{border:2px solid #6a62b0;background:#15122e;border-radius:99px;padding:3px 10px;font-size:13px}
.pprev{width:100%;height:300px;background:#fff;border:3px solid #f4ecd8;border-radius:12px;margin:0 0 14px}
/* ===== New look: graphite + lime (additive skin; light theme and RTL tokens at the bottom) ===== */
:root:root{--bg0:#0a0c10;--bg1:#14171e;--cd:rgba(255,255,255,.05);--cd2:rgba(255,255,255,.09);--ln:rgba(255,255,255,.12);--ink:#f4f6f8;--mut:rgba(244,246,248,.66);--acc:#c6f432;--acct:#c6f432;--accink:#11160a;--cde:#0d1016;--amb:#ffb454;--cor:#ff7a7a;--navbg:rgba(14,16,21,.86);--sheet:rgba(18,21,27,.94);
 --bg:#0a0c10;--card:rgba(255,255,255,.05);--mute:rgba(244,246,248,.66);--line:rgba(255,255,255,.12);--blue:#c6f432;--blued:#c6f432;--yel:#c6f432;--yeld:#c6f432;--ok:#c6f432;--okbg:rgba(198,244,50,.08);--bad:#ff7a7a;--badbg:rgba(255,122,122,.1);--code:#0d1016;--codeink:#f4f6f8;color-scheme:dark}
:root:root[data-theme="light"]{--bg0:#f3f5f8;--bg1:#ffffff;--cd:#ffffff;--cd2:#eef1f5;--ln:rgba(16,24,40,.12);--ink:#12161d;--mut:rgba(18,22,29,.62);--acct:#4f7400;--cde:#eef1f5;--amb:#b86e00;--cor:#d64545;--navbg:rgba(255,255,255,.9);--sheet:rgba(255,255,255,.96);
 --bg:#f3f5f8;--card:#ffffff;--mute:rgba(18,22,29,.62);--line:rgba(16,24,40,.12);--ok:#4f7400;--okbg:rgba(111,160,0,.12);--bad:#d64545;--badbg:rgba(214,69,69,.1);--code:#eef1f5;--codeink:#12161d;color-scheme:light}
html{background:var(--bg0)}
body{background:linear-gradient(180deg,var(--bg1),var(--bg0) 60%) fixed;color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}
h1,h2,.logo,.hd{font-family:"Sora","DM Sans",system-ui,sans-serif}
pre,.opt,.chip,input.fill,.ed,.code,code{font-family:"JetBrains Mono","Space Mono",ui-monospace,monospace}
#app{padding-bottom:128px}
/* glass */
.gcard,.pc,.acc,.rankbox,.rw,.bat,.cmcomp,.fig,.tip,.gnote,.gban,.gdet,.pft,.course,.cb,.cmb,.gcode,.tabs button,.cmtabs button,.cokinds button,.seg button,.atabs button,.mini,.cbtn,.chip,.slot,.opt,.bgt,.uvb span,.chs span,.gchip,.uro,.uname{background:var(--cd);border:1px solid var(--ln);box-shadow:none;color:var(--ink);rotate:none}
.gcard,.pc,.acc,.rankbox,.rw,.bat,.cmcomp,.fig,.gnote,.gban,.pft,.course,.bgt{border-radius:20px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.gcard,.pc,.acc{padding:16px}
.pill{background:var(--cd);border:1px solid var(--ln);border-radius:99px;color:var(--ink);rotate:none!important;font-weight:700}
.kick{font:600 11px "DM Sans",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.lead,.mute2,.pcr,.pfm,small{color:var(--mut)}
.gdet{background:var(--cd)}.gban.gold,.gnote.gold,.rw.me{border-color:var(--acct);background:var(--cd)}
.bat{border-style:solid}.bat.live{border-color:var(--acct)}
.grow,.chrow,.pca{border-top:1px solid var(--ln);border-style:solid none none}
.gtag,.ptag{background:transparent;border:1px solid var(--acct);color:var(--acct)}
.k-project,.k-question,.k-tip{background:transparent;border:1px solid var(--acct);color:var(--acct)}
code{background:var(--cd2);color:var(--acct);border-radius:6px}
.you,.rankbox b{color:var(--acct)}.ok2{color:var(--acct)}.bad2{color:var(--cor)}
/* buttons */
.go,.mini.go2,.cbtn.run,.cmcomp b,.tabs button.on,.cmtabs button.on,.seg button.on,.atabs .on,.cokinds button.on{background:var(--acc);color:var(--accink);border:0;box-shadow:none;border-radius:16px;font-family:"Sora",sans-serif;font-weight:700;rotate:none}
.go{height:54px;padding:0 16px;font-size:17px;border-radius:16px}
.tabs button.on,.cmtabs button.on,.seg button.on,.atabs .on,.cokinds button.on{border-radius:99px;font-family:"DM Sans",sans-serif}
.go:disabled{background:var(--cd2);color:var(--mut);border:0}
.share{background:transparent;border:1px solid var(--ln);color:var(--ink);border-radius:16px;font-family:"DM Sans",sans-serif;font-weight:600}
.mini{border-radius:12px;font-family:"DM Sans",sans-serif}.mini.go2{border-radius:12px;font-size:13px}
.tabs button,.cmtabs button,.seg button,.atabs button,.cokinds button{border-radius:99px;font-family:"DM Sans",sans-serif;font-weight:600}
.bk{border:1px solid var(--ln);background:var(--cd);color:var(--ink);border-radius:16px;box-shadow:none}
.reset{color:var(--mut)}
/* header */
.logo{color:var(--ink);text-shadow:none;font-weight:800;letter-spacing:-.5px}.logo i{color:var(--acct)}
.logo .by b{color:var(--ink)}
/* course page */
.hero{background:var(--cd);border:1px solid var(--ln);box-shadow:none;border-radius:22px;color:var(--ink);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.hero::before,.hero::after{display:none}
.hl b{color:var(--ink);font-family:"Sora",sans-serif}.hl span{color:var(--mut)}
.hero .go{background:var(--acc);color:var(--accink);box-shadow:none;border:0}
.meter,.prog,.pfr .pfbar,.pb{background:var(--cd2);border:0;border-radius:99px;height:8px}
.meter i,.prog div,.pb i,.pfr .pfbar i{background:var(--acc);border-radius:99px}
.prog{height:8px}
.hp{background:transparent;color:var(--ink);border:0;font-family:"Sora",sans-serif}
.path svg path{stroke:var(--ln);stroke-width:3;stroke-dasharray:2 10}
.node{--tc:var(--acct)!important}.node.xl{--tc:var(--amb)!important}
.dot{width:68px;height:68px;border-radius:50%;background:var(--cd);color:var(--tc);border:2px solid var(--tc);box-shadow:none;rotate:none!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.node:active .dot{transform:scale(.96);box-shadow:none}
.node.done .dot{background:var(--cd);color:var(--tc)}
.node.lock .dot{background:transparent;border:2px dashed var(--ln);color:var(--mut)}
.node.now .dot{width:84px;height:84px;margin-bottom:2px;background:var(--acc);color:var(--accink);border-color:var(--acc);font-size:30px}
.node.now::before{content:"Start here";top:-22px;transform:translateX(-50%);rotate:none;background:transparent;color:var(--acct);border:1px solid var(--acct);border-radius:99px;font:600 11px "DM Sans",sans-serif;padding:1px 10px}
.node.xl:not(.done):not(.lock) .dot{background:var(--cd);color:var(--tc);box-shadow:none}
.node b{color:var(--ink);font-weight:600;font-size:14px}.node small{color:var(--mut);font-family:"DM Sans",sans-serif}.node.lock b,.node.lock small{color:var(--mut);opacity:.7}
.unit{background:var(--cd);color:var(--ink);border:1px solid var(--ln);box-shadow:none;border-radius:20px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.unit small{font-family:"DM Sans",sans-serif;color:var(--acct);opacity:1}.unit b{font-family:"Sora",sans-serif}
/* lesson */
h2{font-family:"Sora",sans-serif;font-weight:700;letter-spacing:-.4px;text-shadow:none}
.x{color:var(--mut)}
pre{background:var(--cde);border:1px solid var(--ln);border-left:1px solid var(--ln);border-radius:18px;color:var(--ink)}
pre.out{border-left-color:var(--ln)}pre.out::before{color:var(--acct);font-family:"DM Sans",sans-serif}
.opt{border-radius:18px;padding:14px 16px;font-weight:500;font-size:15px;margin-bottom:10px}
.opt::before{background:transparent;border:1.5px solid var(--ln);color:var(--mut);border-radius:10px;font-family:"DM Sans",sans-serif;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--acct)}.opt:active{transform:none;box-shadow:none}
.opt.sel{border:1.5px solid var(--acct);background:var(--cd);box-shadow:none}.opt.sel::before{background:transparent;border-color:var(--acct);color:var(--acct)}
.opt.right{border:1.5px solid var(--acct);background:var(--cd);box-shadow:none}.opt.right::before{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.opt.wrong{border:1.5px solid var(--cor);background:var(--cd);box-shadow:none}.opt.wrong::before{background:var(--cor);color:#1d0a0a;border-color:var(--cor)}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
input.fill,.fin,.ed,.uname{background:var(--cd);border:1px solid var(--ln);border-radius:16px;color:var(--ink)}
input.fill:focus,.fin:focus,.ed:focus,.uname:focus{border-color:var(--acct);outline:none}
.fin::placeholder,.uname::placeholder{color:var(--mut)}
.fl span{color:var(--mut);font-family:"DM Sans",sans-serif}
.chip{border-radius:12px;box-shadow:none}.slot{border:1px dashed var(--ln);background:transparent}
.foot{background:var(--sheet);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--ln);border-radius:26px 26px 0 0}
.foot.ok{background:var(--sheet);border-top-color:var(--acct)}.foot.bad{background:var(--sheet);border-top-color:var(--cor)}
.foot.ok .fb{color:var(--acct)}.foot.bad .fb{color:var(--cor)}.fb{font-family:"Sora",sans-serif}.fb span{font-family:"DM Sans",sans-serif;color:var(--mut)}
.foot.ok .go{background:var(--acc);color:var(--accink);box-shadow:none}.foot.bad .go{background:var(--cd2);color:var(--ink);box-shadow:none}
.end h1{text-shadow:none;font-family:"Sora",sans-serif}.end .big{rotate:none}
.tip{border:1px solid var(--ln);border-radius:18px}
.bl{background:var(--cde);border:1px solid var(--ln);border-radius:18px}.bln{border-bottom-color:var(--ln);color:var(--ink)}
.bln.sel{background:var(--cd2)}.bln.right{background:var(--okbg)}.bln.wrong{background:var(--badbg)}
.cout{background:var(--cde)!important;border:1px solid var(--ln)!important;border-radius:16px}.cout.bad{color:var(--cor)}.cout.good{color:var(--acct)}
.cbtn{border-radius:14px}.cbtn.run{background:var(--acc);color:var(--accink);border:0}
.ov{background:var(--bg0)}
.opt.cp b{font-family:"Sora",sans-serif}
.obdots i{background:var(--cd2)}.obdots i.on{background:var(--acc)}
.ustrip i{background:var(--cd2)}.ustrip i.on{background:var(--acc)}.ustrip i.half{background:var(--amb)}
/* bottom dock */
.nav{background:var(--navbg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--ln);padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px))}
.nav>div{max-width:none;gap:0!important}
.nav button{border:0;border-radius:0;background:transparent;color:var(--mut);font:600 12px "DM Sans",sans-serif!important;letter-spacing:0!important;text-transform:none;gap:4px;padding:6px 2px;min-height:56px;justify-content:center}
.nav button.on{background:transparent;color:var(--acct);box-shadow:none;border:0}
.nav button.on::before{content:'';position:absolute;top:-9px;left:50%;margin-left:-9px;width:18px;height:3px;border-radius:2px;background:var(--acc)}
.nav .ni{height:24px;display:grid;place-items:center}.nav .ni svg{width:24px;height:24px}
.nav .ni svg.ico{border:0;border-radius:0}
.nav .ni.av svg{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ln)}
.nav button.on .ni.av svg{border-color:var(--acc)}
.nav .bdg,.chbdg{background:var(--acc);color:var(--accink)}
/* profile + avatars */
.pfs{background:transparent;border:0}
.pfav{border:2px solid var(--acc);border-radius:50%;box-shadow:none;background:var(--cd2);width:132px;height:132px}
.pfs.pfstat .pfav{width:132px;height:132px}
.mav{border:1.5px solid var(--ln);background:var(--cd2)}
.rw .mav,.cmcomp .mav{border-color:var(--ln)}.rw.me .mav{border-color:var(--acc)}
.oc{border:1px solid var(--ln);border-radius:16px;box-shadow:none;background:var(--cd2)}.oc.sel{border:2px solid var(--acc);box-shadow:none}
.oc .no{color:var(--ink)}.oc i{background:var(--navbg);color:var(--ink);font-family:"DM Sans",sans-serif}
.sw button{border:2px solid var(--ln);box-shadow:none}.sw button.sel{outline:2px solid var(--acc)}
.gb{border:1px solid var(--ln);background:var(--cd);box-shadow:none;border-radius:22px;color:var(--ink)}
.pfst .pft{border-radius:18px}.pft b{font-family:"Sora",sans-serif}.pft small{font-family:"DM Sans",sans-serif}
.pfr .pfbar{border:0}
.uname{font-family:"Sora",sans-serif;font-weight:700}
/* community + chat */
.pcc,.cocode{background:var(--cde);border:1px solid var(--ln);color:var(--ink);font-family:"JetBrains Mono",monospace}
.pca{border-top:1px solid var(--ln)}.pab{color:var(--mut)}.pab.on{color:var(--cor)}.pab.on2{color:var(--acct)}
.cmcomp{border-style:solid;color:var(--mut)}
.cmb{border-radius:6px 18px 18px 18px}.cmb small{color:var(--mut);font-family:"DM Sans",sans-serif}
.cb{border-radius:18px 18px 18px 6px;font-family:"DM Sans",sans-serif;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.cb.me{background:transparent;color:var(--ink);border:1.5px solid var(--acct);border-radius:18px 18px 6px 18px}
.cb small{color:var(--mut)}
.coform.chatbar{background:var(--navbg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--ln)}
.chrow{border-top:1px solid var(--ln)}.chrow .rn small{color:var(--mut)}
.pprev{border:1px solid var(--ln);border-radius:18px}
.xtoast{background:var(--ink);color:var(--bg0);box-shadow:none;font-family:"DM Sans",sans-serif;border-radius:16px}
.acr .share{border-radius:14px}
.acc b{font-family:"Sora",sans-serif}
.acm.bad{color:var(--cor)}.acm.warn{color:var(--amb)}.acm.good{color:var(--acct)}
.cdn{color:var(--acct)}
/* ===== new Home ===== */
.hm{display:flex;flex-direction:column;gap:18px}
.hm-top{display:flex;align-items:center;gap:12px}
.hm-av{width:48px;height:48px;border-radius:50%;border:2px solid var(--acc);overflow:hidden;background:var(--cd2);flex:none;padding:0}
.hm-av svg{width:100%;height:100%;display:block}
.hm-hi{flex:1;min-width:0}.hm-hi b{display:block;font:700 20px "Sora",sans-serif;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-hi span{font-size:13px;color:var(--mut)}
.hm-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--cd);border:1px solid var(--ln);color:var(--ink);padding:0;position:relative}
.hm-ic svg,.hm-chip svg{width:20px;height:20px}
.hm-chips{display:flex;gap:8px}
.hm-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:99px;background:var(--cd);border:1px solid var(--ln);color:var(--ink);font:700 14px "Sora",sans-serif}
.hm-chip svg{width:16px;height:16px}
.hm-prog{position:relative;overflow:hidden;padding:20px;min-height:170px;display:flex;flex-direction:column;gap:10px;border-radius:24px}
.hm-prog .pt{font:700 34px "Sora",sans-serif;letter-spacing:-1px}
.hm-prog .ps{font-size:14px;color:var(--mut);max-width:62%}
.hm-prog .bar2{height:8px;border-radius:99px;background:var(--cd2);overflow:hidden;max-width:58%}.hm-prog .bar2 i{display:block;height:100%;background:var(--acc);border-radius:99px}
.hm-prog .lv{font:600 12px "DM Sans",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--acct)}
.hm-prog .bust{position:absolute;right:4px;bottom:0;width:150px;height:178px;pointer-events:none;background:none;border:0;border-radius:0;overflow:visible}
.hm-prog .bust svg{width:100%;height:100%;display:block}
.hm-st{display:flex;gap:8px;justify-content:space-between}
.hm-st div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 12px "DM Sans",sans-serif;color:var(--mut)}
.hm-st i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--ln);font-style:normal}
.hm-st .on i{border:1.5px solid var(--acct);color:var(--acct)}.hm-st .on{color:var(--ink)}
.hm-st i svg{width:16px;height:16px}
.hm-h{display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 -6px}.hm-h b{font:700 18px "Sora",sans-serif}.hm-h span{font-size:13px;color:var(--acct);font-weight:600}
.hm-cont{display:flex;align-items:center;gap:14px;padding:14px;text-align:start;width:100%;color:var(--ink);font:inherit;border-radius:20px}
.hm-tile{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none;font-size:26px;background:var(--cd2);border:1px solid var(--ln)}
.hm-cont .tx{flex:1;min-width:0}.hm-cont b{display:block;font:700 16px "Sora",sans-serif}.hm-cont small{display:block;margin:2px 0 8px}
.hm-cont .bar2{height:6px;border-radius:99px;background:var(--cd2);overflow:hidden}.hm-cont .bar2 i{display:block;height:100%;background:var(--acc)}
.hm-play{width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--accink);display:grid;place-items:center;flex:none}.hm-play svg{width:18px;height:18px}
.hm-feat{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.hm-feat::-webkit-scrollbar{display:none}
.hm-fc{flex:none;width:150px;padding:14px;text-align:start;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:10px;scroll-snap-align:start}
.hm-fc .hm-tile{width:100%;height:84px;font-size:38px;border-radius:16px}
.hm-fc b{font:700 16px "Sora",sans-serif}.hm-fc small{margin-top:-6px}
/* course page header */
.cp-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cp-top .hm-ic{flex:none}.cp-top b{font:700 20px "Sora",sans-serif;flex:1;min-width:0}
.cp-hero{display:flex;align-items:center;gap:16px;padding:18px;border-radius:24px;margin-bottom:16px}
.cp-ring{width:74px;height:74px;flex:none;position:relative}.cp-ring svg{width:74px;height:74px;transform:rotate(-90deg)}.cp-ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 16px "Sora",sans-serif}
.cp-hero .tx{flex:1;min-width:0}.cp-hero .tx b{display:block;font:700 18px "Sora",sans-serif}.cp-hero .tx small{display:block;margin:2px 0 10px}
.cp-hero .go{height:44px;font-size:15px;border-radius:14px}
.cp-tools{display:flex;gap:8px;margin:0 0 14px}.cp-tools .share{flex:1;margin:0;padding:10px}
.g{background:var(--cd);border:1px solid var(--ln);border-radius:20px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.hm-prog .ps,.hm-prog .bar2{max-width:52%}
.node.xl.side:not(.done):not(.lock) .dot,.node.xl:not(.done):not(.lock) .dot{background:var(--cd);color:var(--tc);box-shadow:none;border-color:var(--tc)}

/* RTL (Arabic) + light-theme touch-ups */
[lang="ar"] body,[lang="ar"] h1,[lang="ar"] h2,[lang="ar"] .logo,[lang="ar"] .hd,[lang="ar"] .go,[lang="ar"] .fb{font-family:"Cairo","DM Sans",system-ui,sans-serif}
[dir="rtl"] pre,[dir="rtl"] .ed,[dir="rtl"] code,[dir="rtl"] .opt,[dir="rtl"] input.fill,[dir="rtl"] .cout,[dir="rtl"] .chip{direction:ltr;text-align:left}
[dir="rtl"] .hm-prog .bust{right:auto;left:-8px}
[dir="rtl"] .hm-cont,[dir="rtl"] .hm-fc,[dir="rtl"] .rw,[dir="rtl"] .pcn,[dir="rtl"] .hm-hi{text-align:start}
[dir="rtl"] .hm-play svg,[dir="rtl"] .cp-top .hm-ic svg,[dir="rtl"] .go svg{transform:scaleX(-1)}
[dir="rtl"] .cb.me{border-radius:18px 18px 18px 6px}[dir="rtl"] .cb:not(.me){border-radius:18px 18px 6px 18px}
[dir="rtl"] .opt::before{margin-inline-end:10px}
.fig{background:#161a24;border-color:rgba(255,255,255,.12)}
:root[data-theme="light"] .pfav{background:var(--cd2)}
:root[data-theme="light"] .gchip,:root[data-theme="light"] .bgt{background:var(--cd);color:var(--ink)}
:root[data-theme="light"] .hm-chip,:root[data-theme="light"] .hm-ic{box-shadow:0 1px 2px rgba(16,24,40,.06)}
:root[data-theme="light"] .g,:root[data-theme="light"] .gcard,:root[data-theme="light"] .pc,:root[data-theme="light"] .acc,:root[data-theme="light"] .rw,:root[data-theme="light"] .unit,:root[data-theme="light"] .hero{box-shadow:0 1px 3px rgba(16,24,40,.08)}
:root[data-theme="light"] .foot,:root[data-theme="light"] .nav{box-shadow:0 -1px 8px rgba(16,24,40,.06)}
:root[data-theme="light"] .opt.wrong::before{color:#fff}
.hm-tile svg{width:62%;height:62%;display:block}.hm-fc .hm-tile svg{width:56px;height:56px}.cp-top b svg{width:22px;height:22px;vertical-align:-4px;margin-inline-end:6px}.opt.cp .ce svg{width:34px;height:34px;display:block}
/* new avatars */

function pa(d,c,w,arrow){return '<path d="'+d+'" fill="none" stroke="'+(c||CR)+'" stroke-width="'+(w||2)+'"'+(arrow?' marker-end="url(#ah)"':'')+'/>'}
function ci(x,y,r,f,s){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+(f||'none')+'" stroke="'+(s||CR)+'" stroke-width="2"/>'}

    return '<button class="opt cp'+(ui===cu?' sel':'')+'" onclick="jumpTo('+ui+')"><span class="ce">'+u.e+'</span><span><b>Unit '+(ui+1)+' · '+esc(u.t)+'</b><small>'+d+' of '+n+' levels done'+(ui===cu?' · you are here':'')+'</small></span></button>'}).join('')+'<button class="go" onclick="this.parentNode.remove()">Close</button>';

/* ---- unit gating: a unit is passed only when ALL its levels are done, including the Hard level and the Project ---- */
function fromUnit(){var f=Math.max(0,Math.min(LEVELS.length-1,Math.floor(+X.from[S.course])||0));return LEVELS.length?LEVELS[f].u:0}
function levelsDoneIn(ui){var ok=true;LEVELS.forEach(function(lv,i){if(lv.u===ui&&S.done.indexOf(i)<0)ok=false});return ok}
function unitComplete(ui){return levelsDoneIn(ui)&&exDefs(ui).slice(0,2).every(function(d){return exDone(d.id)})}
/* a unit is open when it is the first one, when you jumped to it, when the unit before it is complete,
   or when you already have progress in it or later (accounts made before this rule are never locked out) */
function unitOpen(ui){
  if(ui<=0||ui<=fromUnit()||unitComplete(ui-1))return true;
  for(var i=0;i<LEVELS.length;i++)if(LEVELS[i].u>=ui&&S.done.indexOf(i)>-1)return true;
  return false;
}
/* the first required extra level (Hard level or Project) that is still missing in a unit whose normal levels are all done */
function pendingExtra(){
  for(var ui=0;ui<UNITS.length;ui++){
    if(!levelsDoneIn(ui))continue;
    var d=exDefs(ui).slice(0,2).filter(function(x){return!exDone(x.id)})[0];
    if(d)return d;
  }
  return null;
}

var AC={token:null,user:null,mode:'boot',ok:null,sync:'',timer:null,retry:null,replace:false,busy:false,view:'home'};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
AC.token=lsGet('pypath_token');
try{AC.user=JSON.parse(lsGet('pypath_user')||'null')}catch(e){}
if(!AC.user||!AC.token){AC.token=null;AC.user=null}
function acStore(){lsSet('pypath_token',AC.token);lsSet('pypath_user',AC.token?JSON.stringify(AC.user):null)}

function api(method,path,body){
  if(API===null)return Promise.reject(Object.assign(new Error('offline'),{offline:true}));
  var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},10000),h={'Content-Type':'application/json'};
  if(AC.token)h.Authorization='Bearer '+AC.token;
  return fetch(API+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined,signal:ctl.signal}).then(function(r){
    clearTimeout(to);
    return r.json().catch(function(){return{}}).then(function(j){
      if(!r.ok){var e=new Error(j.error||('Error '+r.status));e.status=r.status;e.info=j;
        if(r.status===401&&AC.token&&path.indexOf('/api/login')<0)acExpire(j.error);
        throw e}
      return j})
  },function(){clearTimeout(to);throw Object.assign(new Error('Cannot reach the server'),{offline:true})});
}

/* --- state helpers (the merge rules match the server: progress only ever grows) --- */
function acPayload(){return{progress:{xp:S.xp,streak:S.streak,last:S.last,course:S.course,dn:S.dn},extra:{from:X.from,ex:X.ex,t:X.t||0,g:G(),profile:{gender:X.profile.gender,av:X.profile.av||{}}}}}
function dayVal(s){var t=Date.parse(s);return isNaN(t)?0:t}
function mergeEx(a,b){var r={},k={};a=a||{};b=b||{};Object.keys(a).concat(Object.keys(b)).forEach(function(x){k[x]=1});Object.keys(k).forEach(function(x){var u={};(a[x]||[]).concat(b[x]||[]).forEach(function(v){u[v]=1});r[x]=Object.keys(u)});return r}
/* newest profile wins, but an empty profile / start-unit never wipes a filled one */
function pickExtra(ea,eb,ex,g){
  var base=eb.t>ea.t?eb:ea.t>eb.t?ea:((eb.profile.gender||!ea.profile.gender)?eb:ea),other=base===eb?ea:eb,r=Object.assign({},base,{ex:ex,g:g});
  if(!base.profile.gender&&other.profile.gender)r.profile=other.profile;
  if(!Object.keys(base.from||{}).length&&Object.keys(other.from||{}).length)r.from=other.from;
  return r;
}
function mergeState(a,b){
  if(!a)return b;
  var pa=a.progress,pb=b.progress,dn={},keys={};
  Object.keys(pa.dn||{}).concat(Object.keys(pb.dn||{})).forEach(function(k){keys[k]=1});
  Object.keys(keys).forEach(function(k){var u={};(pa.dn[k]||[]).concat(pb.dn[k]||[]).forEach(function(i){u[i]=1});dn[k]=Object.keys(u).map(Number).sort(function(x,y){return x-y})});
  var da=dayVal(pa.last),db=dayVal(pb.last);
  return{progress:{xp:Math.max(pa.xp,pb.xp),dn:dn,course:pb.course,last:db>=da?pb.last:pa.last,streak:db>da?pb.streak:da>db?pa.streak:Math.max(pa.streak,pb.streak)},extra:pickExtra(a.extra,b.extra,mergeEx(a.extra.ex,b.extra.ex),mergeG(a.extra.g,b.extra.g))};
}
function applyState(st,keepCourse){
  var p=st.progress,e=st.extra||{},pr=e.profile||{};
  S.xp=p.xp|0;S.streak=p.streak|0;S.last=p.last||'';
  S.dn=Object.assign({python:[]},p.dn||{});
  if(!keepCourse)S.course=p.course||'python';
  X.g=gFix(e.g);X.from=e.from||{};X.ex=e.ex&&typeof e.ex==='object'?e.ex:{};X.t=e.t||0;
  X.profile.gender=pr.gender==='f'||pr.gender==='m'?pr.gender:'';
  X.profile.av=X.profile.gender&&pr.av&&Object.keys(pr.av).length?pr.av:null;
  useCourse(S.course);
}
function resetLocal(){S.xp=0;S.streak=0;S.last='';S.dn={python:[]};X.from={};X.ex={};X.t=0;X.g=null;X.profile.gender='';X.profile.av=null;X.profile.name='';S.course='python';useCourse('python')}
function sig(){return JSON.stringify([S.xp,S.streak,S.dn,X.ex,X.profile.gender,X.profile.av,X.from,X.g])}
function setStatus(t){AC.sync=t;var e=document.getElementById('acStatus');if(e)e.textContent=t}
function refreshView(){if(L!==null||AC.mode!=='app')return;if(AC.view==='profile'&&!PF.pick)profile();else if(AC.view==='home')home()}

/* Called after login or on start-up with the server's copy of this user's data */
function acLink(j){
  var email=AC.user.email,owner=lsGet('pypath_owner');
  if(!X.t&&X.profile.gender)X.t=Date.now();   /* profile saved before accounts existed has no timestamp */
  if(owner&&owner!==email){            /* a different person used this device: never mix two accounts */
    if(j.state)applyState(j.state);else resetLocal();
  }else{                               /* same person, or old local progress from before accounts: keep it all */
    applyState(j.state?mergeState(j.state,acPayload()):acPayload(),true);
  }
  lsSet('pypath_owner',email);
  X.profile.name=AC.user.name.slice(0,20);
  _save();_saveX();
}
function acPull(){
  return api('GET','/api/state').then(function(j){
    AC.ok=true;if(j.user){AC.user=j.user;acStore()}
    var before=sig();acLink(j);if(sig()!==before)refreshView();
  }).catch(function(e){if(e.offline){AC.ok=false;setStatus('Offline: your progress is saved on this device')}})
}
function acPush(){
  if(!AC.token||AC.mode!=='app')return Promise.resolve();
  var body=acPayload(),rep=AC.replace;if(rep)body.replace=true;
  return api('PUT','/api/state',body).then(function(j){
    AC.ok=true;AC.replace=false;
    setStatus('Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
    if(!rep&&j.state){var before=sig();applyState(mergeState(j.state,acPayload()),true);_save();_saveX();if(sig()!==before)refreshView()}
  }).catch(function(e){
    if(e.offline){AC.ok=false;setStatus('Offline: will sync when the server is back');clearTimeout(AC.retry);AC.retry=setTimeout(acPush,30000)}
    else if(e.status!==401)setStatus('Sync problem: '+e.message)
  });
}
function queueSync(){if(!AC.token||AC.mode!=='app')return;clearTimeout(AC.timer);AC.timer=setTimeout(acPush,1500)}
function acSyncNow(){setStatus('Syncing…');acPull().then(acPush)}

  authShell('<div class="end"><div class="big">📨</div><h1>Request sent!</h1><p class="lead">An admin will review your registration. We will email <b>'+esc(email)+'</b> when your account is ready, then you can log in here.</p><button class="go" onclick="authScreen(\'login\')">Go to log in</button></div>');
}
function acSubmit(ev,mode){
  ev.preventDefault();if(AC.busy)return false;
  var g=function(id){var e=document.getElementById(id);return e?e.value.trim():''},btn=document.getElementById('acGo');
  var msg=function(t,k){var m=document.getElementById('acMsg');if(m){m.textContent=t;m.className='acm'+(k?' '+k:'')}};
  var email=g('re').toLowerCase(),pw=document.getElementById('rp').value,reg=mode==='register',name,age,college;
  if(reg){
    name=g('rn');age=Math.floor(+g('ra'));college=g('rc');
    if(name.length<2){msg('Please enter your full name','bad');return false}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){msg('Please enter a valid email address','bad');return false}
    if(!(age>=5&&age<=120)){msg('Please enter a valid age','bad');return false}
    if(college.length<2){msg('Please enter your college or university','bad');return false}
    if(pw.length<6){msg('Password must be at least 6 characters','bad');return false}
    if(pw!==document.getElementById('rp2').value){msg('The two passwords do not match','bad');return false}
  }else if(!email||!pw){msg('Enter your email and password','bad');return false}
  AC.busy=true;btn.disabled=true;msg('Please wait…');
  var req=reg?api('POST','/api/register',{name:name,email:email,age:age,college:college,password:pw}):api('POST','/api/login',{email:email,password:pw});
  req.then(function(j){
    AC.token=j.token;AC.user=j.user;acStore();
    return api('GET','/api/state').then(function(s){AC.ok=true;acLink(s);AC.busy=false;startApp();acPush()});
  }).catch(function(e){
    AC.busy=false;if(btn)btn.disabled=false;
    if(!reg&&AC.mode!=='app'){AC.token=null;AC.user=null;acStore()}
    msg(e.offline?'Cannot reach the server. Check that it is running and that you are on the same network.':e.message,e.info&&e.info.status==='pending'?'warn':'bad');
  });
  return false;
}
function acExpire(m){AC.token=null;AC.user=null;acStore();clearTimeout(AC.timer);clearTimeout(AC.retry);authScreen('login',m||'Please log in again.','bad')}
function acLogout(){

  acPush().then(done,done);
}

bug in this program\nx = \"3.5\"\ny = float(x)\nprint(y + 1)","line":2,"symptom":"It crashes with a ValueError.","why":"int() cannot read text containing a decimal point. Use float() for decimal text."},{"code":"a = 1\nb = 2\ntemp = a\na = b\nb = a\nprint(a, b)","fixed":"a = 1\nb = 2\ntemp = a\na = b\nb = temp\nprint(a, b)","line":4,"symptom":"It prints 2 2 but the goal was to swap them and print 2 1.","why":"After a = b the old value of a is only in temp. b must get temp, not the new a."},{"code":"# Find the bug in this program\nmy_age = 20\nnext-age = my_age + 1\nprint(next_age)","fixed":"# Find the bug in this program\nmy_age = 20\nnext_age = my_age + 1\nprint(next_age)","line":2,"symptom":"It crashes with a SyntaxError.","why":"A dash is not allowed in a variable name because Python reads it as minus. Use an underscore."}]}]},{"hard":[{"type":"out","code":"print(17 // 5, 17 % 5, 17 / 5)","answer":"3 2 3.4","wrong":["3 2 3","3.4 2 3","3 3 3.4"],"why":"// gives 3, % gives the remainder 2, and / gives the exact float 3.4."},{"type":"out","code":"print(-17 // 5, -17 % 5)","answer":"-4 3","wrong":["-3 2","-4 -2","-3 3"],"why":"// rounds down to -4, and the remainder is what makes -4 * 5 + remainder = -17, which is 3."},{"type":"out","code":"print(2 * 3 ** 2, (2 * 3) ** 2)","answer":"18 36","wrong":["36 36","18 18","36 18"],"why":"Power happens before multiplication unless brackets say otherwise."},{"type":"out","code":"x = 7\nx //= 2\nx **= 2\nx -= 1\nprint(x)","answer":"8","wrong":["9","11","5"],"why":"7 // 2 = 3, 3 ** 2 = 9, 9 - 1 = 8."},{"type":"out","code":"print(round(2.5), round(3.5), round(2.567, 1))","answer":"2 4 2.6","wrong":["3 4 2.6","3 3 2.6","2 4 2.5"],"why":"round() sends exact halves to the nearest even number, so 2.5 becomes 2 and 3.5 becomes 4."},{"type":"out","code":"print(not 3 > 2 or 1 == 1)","answer":"True","wrong":["False","Error","None"],"why":"Comparisons go first: not True is False, then False or True is True."},{"type":"out","code":"print(max(3, 9, 4) - min(3, 9, 4), abs(min(-3, -8)))","answer":"6 8","wrong":["6 3","12 8","6 -8"],"why":"9 - 3 is 6, and min(-3, -8) is -8 whose abs is 8."},{"type":"mc","q":"Which expression is True when n is an even number?","code":"","ans":"n % 2 == 0","wrong":["n // 2 == 0","n / 2 == 0","n % 2 == 2"],"why":"An even number leaves a remainder of 0 when divided by 2."},{"type":"fill","code":"# Make it print: 2 15\ntotal = 135\nprint(total ___ 60, total % 60)","ans":["//"],"expect":"2 15","why":"// gives whole hours (2) and % gives the leftover minutes (15)."},{"type":"ord","lines":["n = 7","n *= 3","n %= 5","print(n)"],"expect":"3","why":"7 * 3 = 21, then 21 % 5 leaves 1. The order matters: doing % 5 first would give a different answer."}],"project":{"title":"Coin Changer","brief":"Write a program that reads an amount in cents with «amount = int(input())» (no prompt text) and prints four lines: «Quarters: q», «Dimes: d», «Nickels: n», «Pennies: p», using as many 25-cent quarters as possible, then 10-cent dimes, then 5-cent nickels, with the rest as pennies. Use «//» and «%» (or «%=»). Finally print «Even amount:» followed by True or False (is amount even? use «%» and «==»). This project combines input, int(), variables, arithmetic and comparisons from Units 1 to 3.","starter":"# Coin Changer\namount = int(input())\n# TODO: quarters, then the leftover\n# TODO: dimes, nickels, pennies\n# TODO: print the five lines\n","tests":[{"label":"amount = 87 cents","stdin":"87\n","o":"Quarters: 3\nDimes: 1\nNickels: 0\nPennies: 2\nEven amount: False"},{"label":"amount = 100 cents","stdin":"100\n","o":"Quarters: 4\nDimes: 0\nNickels: 0\nPennies: 0\nEven amount: True"},{"label":"amount = 4 cents","stdin":"4\n","o":"Quarters: 0\nDimes: 0\nNickels: 0\nPennies: 4\nEven amount: True"},{"label":"amount = 41 cents","stdin":"41\n","o":"Quarters: 1\nDimes: 1\nNickels: 1\nPennies: 1\nEven amount: False"},{"label":"amount = 0 cents","stdin":"0\n","o":"Quarters: 0\nDimes: 0\nNickels: 0\nPennies: 0\nEven amount: True"}]},"bugs":[{"title":"Bug hunt 1","items":[{"code":"a = 7\nb = 8\navg = a + b / 2\nprint(\"Average:\", avg)","fixed":"a = 7\nb = 8\navg = (a + b) / 2\nprint(\"Average:\", avg)","line":2,"symptom":"It prints Average: 11.0 instead of 7.5.","why":"Division happens before addition, so only b was halved. Use brackets around a + b."},{"code":"# Find the bug in this program\nseconds = 135\nminutes = seconds / 60\nprint(\"Whole minutes:\", minutes)","fixed":"# Find the bug in this program\nseconds = 135\nminutes = seconds // 60\nprint(\"Whole minutes:\", minutes)","line":2,"symptom":"It prints Whole minutes: 2.25 instead of 2.","why":"/ gives an exact float. // gives the whole number of minutes."},{"code":"# Find the bug in this program\nside = 4\narea = side * 2\nprint(\"Area:\", area)","fixed":"# Find the bug in this program\nside = 4\narea = side ** 2\nprint(\"Area:\", area)","line":2,"symptom":"It prints Area: 8 instead of 16.","why":"side * 2 doubles the number; squaring needs the power operator **."}]},{"title":"Bug hunt 2","items":[{"code":"# Find the bug in this program\nscore = 10\nscore =+ 5\nprint(\"Score:\", score)","fixed":"# Find the bug in this program\nscore = 10\nscore += 5\nprint(\"Score:\", score)","line":2,"symptom":"It prints Score: 5 instead of 15.","why":"The line =+ 5 just assigns +5. The shortcut for adding is +=."},{"code":"# Find the bug in this program\nn = 7\neven = n % 2 == 1\nprint(\"Even:\", even)","fixed":"# Find the bug in this program\nn = 7\neven = n % 2 == 0\nprint(\"Even:\", even)","line":2,"symptom":"It says Even: True for the number 7.","why":"An odd number leaves remainder 1; an even number leaves remainder 0, so compare with 0."},{"code":"# Find the bug in this program\nage = 20\nteen = age >= 13 or age <= 19\nprint(\"Teen:\", teen)","fixed":"# Find the bug in this program\nage = 20\nteen = age >= 13 and age <= 19\nprint(\"Teen:\", teen)","line":2,"symptom":"It says Teen: True for a 20 year old.","why":"With or, one true side is enough and every number passes. Both conditions must hold, so use and."}]}]},{"hard":[{"type":"out","code":"s = \"programming\"\nprint(s[3:7])\nprint(s[::-1][:3])\nprint(s[-4:-1])","answer":"gram\ngni\nmin","wrong":["gramm\ngni\nming","ogra\nnig\nmin","gram\ngnim\nmin"],"why":"s[3:7] stops before index 7. Reversed, the first three letters are g, n, i. s[-4:-1] stops before the last letter."},{"type":"out","code":"s = \" Hi There \"\nprint(s.strip().lower().replace(\"h\", \"j\"))\nprint(len(s))","answer":"ji tjere\n10","wrong":["ji tjere\n8","hi there\n10","ji there\n10"],"why":"strip, lower and replace chain left to right; replace changes every h. len(s) counts the original spaces too, because s itself never changed."},{"type":"out","code":"s = \"abc\"\ns.upper()\ns = s + \"d\"\nprint(s)","answer":"abcd","wrong":["ABCd","ABCD","abc"],"why":"s.upper() returns a new string, but nobody stored it. s stays lowercase."},{"type":"out","code":"parts = \"a,b,,c\".split(\",\")\nprint(parts)\nprint(len(parts))","answer":"['a', 'b', '', 'c']\n4","wrong":["['a', 'b', 'c']\n3","['a', 'b', ',', 'c']\n4","['a', 'b', '', 'c']\n3"],"why":"Two commas in a row hide an empty string between them, so there are 4 pieces."},{"type":"out","code":"x = 5\ny = \"5\"\nprint(f\"{x + x} {y + y} {y * x}\")","answer":"10 55 55555","wrong":["10 10 25","55 55 55555","10 55 25"],"why":"Numbers add, strings join, and a string times a number repeats the string."},{"type":"out","code":"print(\"ab\" in \"cabd\", \"ba\" in \"cabd\", \"\" in \"cabd\")","answer":"True False True","wrong":["True False False","True True True","False False True"],"why":"in checks for an exact piece, in order. Empty text is inside every string."},{"type":"mc","q":"What does \"hello\"[1:-1] give?","code":"","ans":"ell","wrong":["hell","ello","el"],"why":"Start at index 1 (e), stop before the last letter (index -1), so the o is left out: ell."},{"type":"fill","code":"# Make it print: desserts\nword = \"stressed\"\nprint(word___)","ans":["[::-1]","[-1::-1]"],"expect":"desserts","why":"[::-1] reverses a string, so \"stressed\" becomes \"desserts\"."},{"type":"ord","lines":["words = \"red green blue\"","parts = words.split()","result = \"-\".join(parts)","print(result.upper())"],"expect":"RED-GREEN-BLUE","why":"Split into a list, join with dashes, then shout it."},{"type":"out","code":"name = \"Ada\"\nage = 36\ntext = f\"{name[0]}{age // 10}\"\nprint(text * 2)","answer":"A3A3","wrong":["Ada3Ada3","A36A36","A6A6"],"why":"name[0] is A and 36 // 10 is 3, so text is A3. Repeating it twice gives A3A3."}],"project":{"title":"Username Maker","brief":"Combine input, variables, indexing, methods and f-strings. Read a first name and a last name (two separate input() lines). Make the username: the first letter of the first name plus the whole last name, all lowercase. Print it on line 1. Print «Length: N» (N = number of characters in the username) on line 2. Print «Initials: A.L.» on line 3 (capital first letters, each followed by a dot).","starter":"first = input().strip()\nlast = input().strip()\n# TODO: build the username (first letter + last name, lowercase)\n# TODO: print the username\n# TODO: print \"Length: N\"\n# TODO: print \"Initials: A.L.\" style line\n","tests":[{"label":"Ada Lovelace","stdin":"Ada\nLovelace\n","o":"alovelace\nLength: 9\nInitials: A.L."},{"label":"Alan Turing","stdin":"Alan\nTuring\n","o":"aturing\nLength: 7\nInitials: A.T."},{"label":"lower-case input","stdin":"grace\nhopper\n","o":"ghopper\nLength: 7\nInitials: G.H."},{"label":"extra spaces and capitals","stdin":"  BOB  \n  Li \n","o":"bli\nLength: 3\nInitials: B.L."}]},"bugs":[{"title":"Bug hunt 1","items":[{"code":"# Goal: print the last letter\nword = \"python\"\nlast = word[len(word)]\nprint(last)","fixed":"# Goal: print the last letter\nword = \"python\"\nlast = word[len(word) - 1]\nprint(last)","line":2,"symptom":"It crashes with an IndexError instead of printing the last letter.","why":"Indexes start
