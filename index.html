/* ===== GAME LAYER 1: state, streak protection, daily challenges, spaced review, badges, unlocks =====
   Everything here lives in X.g, which is saved with the profile and synced by the server ("g" block).
   Accounts saved before this existed simply get fresh defaults, so nobody's data is touched. */
function gNew(){return{t:0,ob:0,pd:0,pl:0,fz:0,fe:0,fu:0,fk:'',wp:0,ms:0,dc:0,da:0,rc:0,sh:0,d:{day:'',l:0,p:0,q:-1,c:[0,0,0],a:0},rv:[],bd:[],ce:{}}}
function gTag(v,n){return String(v==null?'':v).slice(0,n).replace(/[^A-Za-z0-9_:\-]/g,'')}
function gNum(v,lo,hi){v=Number(v);return isFinite(v)?Math.min(hi,Math.max(lo,Math.floor(v))):lo}
function gStr(v,n){return typeof v==='string'?v.slice(0,n):''}
function gFix(g){   /* same rules as the server's cleanG */
  g=g&&typeof g==='object'?g:{};
  var d=g.d&&typeof g.d==='object'?g.d:{},c=Array.isArray(d.c)?d.c:[],q=Math.floor(Number(d.q)),seen={};
  var rv=(Array.isArray(g.rv)?g.rv:[]).filter(function(x){return x&&typeof x==='object'&&gTag(x.i,24)}).slice(0,150).map(function(x){return{i:gTag(x.i,24),b:gNum(x.b,0,5),d:gNum(x.d,0,1e6)}});
  var bd=(Array.isArray(g.bd)?g.bd:[]).map(function(x){return gTag(x,20)}).filter(function(x){if(!x||seen[x])return false;seen[x]=1;return true}).slice(0,80);
  var ce={};if(g.ce&&typeof g.ce==='object')Object.keys(g.ce).slice(0,4).forEach(function(k){var v=g.ce[k];if(v&&typeof v==='object')ce[gTag(k,30)]={t:gNum(v.t,0,9e15),id:gTag(v.id,12),n:gStr(v.n,40)}});
  return{t:gNum(g.t,0,9e15),ob:g.ob?1:0,pd:g.pd?1:0,pl:gNum(g.pl,0,99),fz:gNum(g.fz,0,9),fe:gNum(g.fe,0,1e4),fu:gNum(g.fu,0,1e4),fk:gStr(g.fk,40),wp:g.wp?1:0,ms:gNum(g.ms,0,1e5),dc:gNum(g.dc,0,1e5),da:gNum(g.da,0,1e5),rc:gNum(g.rc,0,1e6),sh:gNum(g.sh,0,1e5),
    d:{day:gStr(d.day,10),l:gNum(d.l,0,999),p:gNum(d.p,0,999),q:isFinite(q)?Math.min(5,Math.max(-1,q)):-1,c:[c[0]?1:0,c[1]?1:0,c[2]?1:0],a:d.a?1:0},rv:rv,bd:bd,ce:ce};
}
function mergeG(a,b){   /* same rules as the server's mergeG */
  a=gFix(a);b=gFix(b);
  var nw=b.t>=a.t?b:a,od=nw===b?a:b,same=a.d.day&&a.d.day===b.d.day,m=Math.max;
  var d=same?{day:a.d.day,l:m(a.d.l,b.d.l),p:m(a.d.p,b.d.p),q:m(a.d.q,b.d.q),c:[0,1,2].map(function(i){return a.d.c[i]||b.d.c[i]}),a:a.d.a||b.d.a}:nw.d;
  var seen={},bd=a.bd.concat(b.bd).filter(function(x){if(seen[x])return false;seen[x]=1;return true}).slice(0,80);
  return{t:nw.t,ob:a.ob||b.ob,pd:a.pd||b.pd,pl:nw.pl||od.pl,fz:nw.fz,fe:m(a.fe,b.fe),fu:m(a.fu,b.fu),fk:nw.fk,wp:nw.wp,ms:m(a.ms,b.ms),dc:m(a.dc,b.dc),da:m(a.da,b.da),rc:m(a.rc,b.rc),sh:m(a.sh,b.sh),d:d,rv:nw.rv,bd:bd,ce:Object.assign({},od.ce,nw.ce)};
}

/* ---- streak protection ---- */
function freezeGive(n){var g=G(),add=Math.min(n,5-g.fz);if(add>0){g.fz+=add;g.fe+=add}return add}
function streakCheck(){
  var g=G();if(!S.last||S.streak<=0)return false;
  var last=new Date(S.last);if(isNaN(last))return false;
  var gap=gDayN()-gDayN(last);if(gap<=1)return false;       /* studied today or yesterday: the streak is alive */
  var need=0,i,d,wk;
  for(i=1;i<gap;i++){d=new Date(last);d.setDate(d.getDate()+i);wk=d.getDay()===0||d.getDay()===6;if(!(g.wp&&wk))need++}
  if(need<=g.fz){
    var y=new Date();y.setDate(y.getDate()-1);S.last=y.toDateString();
    if(need){g.fz-=need;g.fu+=need;GM.notice='❄️ '+(need===1?'A streak freeze':need+' streak freezes')+' kept your '+S.streak+'-day streak alive.'}
    else GM.notice='🏖️ Your weekend pass kept your '+S.streak+'-day streak alive.';
    g.fk=gKey();gSave();save();return true;
  }
  var lost=S.streak;S.streak=0;GM.notice='Your '+lost+'-day streak ended. Start a new one today!';gSave();save();return true;
}

  if(S.last!==t){var y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=t;streakReward(S.streak)}

  LEVELS.forEach(function(lv,i){if(S.done.indexOf(i)>-1)seen[lv.u]=1});
  units=Object.keys(seen).map(Number);if(!units.length)units=[0];

  pool=shuffle(pool);gens=shuffle(gens);

var REGP=null;
function loadRegistry(){
  if(REGP)return REGP;
  REGP=(API===null?Promise.resolve([]):fetch('/content/index.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():[]}).catch(function(){return[]})).then(function(list){
    (Array.isArray(list)?list:[]).forEach(function(m){if(m&&/^[a-z0-9]{1,12}$/.test(m.id)&&!courseById(m.id))COURSES.push({id:m.id,t:m.t,e:m.e,d:m.d,lang:m.lang,lazy:true,size:m.size|0,units:null,gens:{}})});
    return COURSES;
  });
  return REGP;

function convertUnit(c,u,ui){
  return{t:u.t,e:u.e,lessons:u.lessons,hand:u.hand.map(function(q,qi){var o=xq(q,10);o.rid=c.id+':'+ui+'q'+qi;return o}),x:{hard:u.hard,project:u.project,bugs:u.bugs}};
}
function loadCourse(c){
  if(c.loading)return c.loading;
  function j(r){if(!r.ok)throw new Error('Could not load '+c.t);return r.json()}
  c.loading=fetch('/content/'+c.id+'/course.json').then(j).then(function(m){
    return Promise.all(m.units.map(function(f){return fetch('/content/'+c.id+'/'+f+'.json').then(j)}));
  }).then(function(us){
    c.units=us.map(function(u,ui){return convertUnit(c,u,ui)});c.size=courseSize(c);c.loading=null;
    if(S.want===c.id){var id=c.id;S.want='';useCourse(id);save();if(AC.mode==='app'&&L===null&&AC.view==='home')home()}
    return c;
  }).catch(function(e){c.loading=null;gToast(e&&e.message?e.message:'Could not load the course. Check your connection.');return c});
  return c.loading;
}

  try{var hs=app.querySelector('.hm-st');if(hs)hs.insertAdjacentHTML('afterend','<button class="g hm-cont" onclick="tourneyScreen()"><span class="hm-tile">🏆</span><span class="tx"><b>'+T('Weekly tournament')+'</b><small style="margin:2px 0 0">'+T('Ends in')+' '+tnLeftTxt(tnLeft())+'</small></span><span class="hm-play">'+IC.play+'</span></button>');if(LANG==='ar')trDom(app)}catch(e){}
};
home=function(){return CV.map?courseMap():dash()};

/* ===== New avatars: ready-made SVG characters =====
   The old drawn avatars, the customise tabs and the old unlockable items are no longer shown.
   Their code stays in this file, unused. Saved avatar data is never changed or removed:
   the old fields stay as they are and one new field, "pa", records the chosen character. */
var PA_N=27,PA_IDS=[];(function(){for(var i=1;i<=PA_N;i++)PA_IDS.push(('0'+i).slice(-2))})();
function paOk(v){return typeof v==='string'&&PA_IDS.indexOf(v)>-1}
function paUrl(id,small){return'/avatars/'+(small?'small/':'')+'avatar-'+id+(small?'.webp':'.svg')}
function paHash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Math.abs(h)}
function paOf(a){   /* the chosen character; players who still have an old avatar get a steady pick until they choose */
  if(a&&paOk(a.pa))return a.pa;
  var k=a&&typeof a==='object'?Object.keys(a).filter(function(x){return x.charAt(0)!=='_'&&x!=='pa'}).sort().map(function(x){return x+':'+a[x]}).join('|'):'';
  return PA_IDS[paHash(k)%PA_N];
}
var _avClean=avClean;
avClean=function(a,g){var o=_avClean(a,g);if(a&&typeof a==='object'&&paOk(a.pa))o.pa=a.pa;return o};
avRender=function(g,cfg,o){
  o=o||{};var id=paOf(avClean(cfg,g));
  return'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Avatar"><image href="'+paUrl(id,!!o.vb)+'" width="100" height="100"/></svg>';
};
gAvatarImg=function(){   /* share cards: draw the character into the 480 x 520 frame */
  return new Promise(function(res){
    var P=X.profile;if(!P.gender){res(null);return}
    var im=new Image();
    im.onload=function(){try{var c=document.createElement('canvas');c.width=480;c.height=520;c.getContext('2d').drawImage(im,-20,0,520,520);res(c)}catch(e){res(null)}};
    im.onerror=function(){res(null)};
    im.src=paUrl(paOf(avClean(P.av,P.gender)));
  });
};
function paDraw(){var e=document.getElementById('pfAv');if(e)e.innerHTML=avRender(X.profile.gender||'m',X.profile.av)}
function paPick(id){
  var P=X.profile,first=!P.gender;
  if(first)P.gender='m';   /* kept only because older code and the server expect it; it is no longer a visible choice */
  P.av=Object.assign({},P.av&&typeof P.av==='object'?P.av:{},{pa:id});
  saveX();
  if(first){PF.pick=false;PF.edit=false;profile();return}
  [].forEach.call(document.querySelectorAll('#paGrid .oc'),function(b){var on=b.getAttribute('data-id')===id;b.classList.toggle('sel',on);b.setAttribute('aria-pressed',on)});
  paDraw();
}
function paScreen(){
  L=null;AC.view='profile';
  var P=X.profile,first=!P.gender,cur=first?'':paOf(avClean(P.av,P.gender)),keep=document.getElementById('paGrid')?window.pageYOffset:0;
  app.innerHTML='<div class="top"><div class="logo">'+(first?'Choose your <i>Avatar</i>':'Edit <i>Avatar</i>')+'</div>'+(first?'':'<button class="mini go2" onclick="pfDone()">✓ Done</button>')+'</div>'+
    (first?'':'<div class="pfs pfstat"><div class="pfav" id="pfAv"></div></div>')+
    '<p class="lead" style="margin:12px 0">Pick the character that shows next to your name.</p>'+
    '<div class="og pagrid" id="paGrid">'+PA_IDS.map(function(id){
      return'<button class="oc'+(id===cur?' sel':'')+'" data-id="'+id+'" aria-label="Avatar '+id+'" aria-pressed="'+(id===cur)+'" onclick="paPick(\''+id+'\')"><img src="'+paUrl(id,true)+'" alt="" width="96" height="96" loading="lazy" decoding="async"></button>'}).join('')+'</div>'+nav('me');
  if(!first)paDraw();
  window.scrollTo(0,keep);
}
var _profile5=profile;
profile=function(){
  var P=X.profile;
  if(!P.gender||PF.pick||PF.edit){paScreen();return}
  return _profile5.apply(this,arguments);
};
unlockIds=function(){return[]};   /* old unlockable characters and outfits are retired */
var _gProfileHTML=gProfileHTML;
gProfileHTML=function(){return _gProfileHTML.apply(this,arguments).replace(/<details class="gcard"><summary>🎁 Rewards[\s\S]*?<\/details>/,'')};
var _shopScreen=shopScreen;
shopScreen=function(){
  _shopScreen.apply(this,arguments);
  try{[].forEach.call(app.querySelectorAll('.hm-h'),function(h){if(/Avatar items|عناصر الأفاتار/.test(h.textContent)){var n=h.nextElementSibling;if(n)n.remove();h.remove()}})}catch(e){}
};
