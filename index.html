.og{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.oc{position:relative;aspect-ratio:1;border:3px solid #f4ecd8;border-radius:14px;background:#9a917f;padding:0;overflow:hidden;display:grid;place-items:center;box-shadow:3px 3px 0 #3a3470}

.sw{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}

.sw button.sel{outline:3px solid #ffc93c;outline-offset:2px}
#pfOpts .kick{margin:6px 0 10px}
.gpick{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}
.gb{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 10px;border:3px solid #f4ecd8;border-radius:18px;background:#1d1946;color:#f4ecd8;font:800 18px "Bricolage Grotesque",system-ui,sans-serif}

.gb.m{box-shadow:5px 5px 0 #4f9bff}.gb.m .sg{color:#4f9bff}

.authf{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.fl span{display:block;font:700 12px "Space Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#19c6b7;margin-bottom:4px}
.fin{width:100%;font:700 17px "Bricolage Grotesque",system-ui,sans-serif;padding:12px 14px;border-radius:12px;border:3px solid #f4ecd8;background:#1d1946;color:#f4ecd8}

.acm{min-height:24px;font-weight:700;margin:12px 0;text-align:center}

.acc{margin-top:16px;border:3px solid #f4ecd8;border-radius:14px;background:#1d1946;padding:14px;text-align:center;box-shadow:4px 4px 0 #3a3470}

.acc .kick{margin:0 0 6px}
.acr{display:flex;gap:10px;margin-top:12px}
.acr .share{margin:0;flex:1}
.uro{display:block;max-width:320px;margin:0 auto;background:#1d1946;color:#f4ecd8;border:3px solid #f4ecd8;border-radius:12px;padding:8px 12px;font:800 22px "Bricolage Grotesque",system-ui,sans-serif;overflow-wrap:anywhere}
/* Part 1 */
.opt{white-space:pre-wrap}
.node.side{width:84px}.node.side .dot{width:54px;height:54px;font-size:22px;margin-bottom:2px}.node.side small{font-size:11px;line-height:1.1;display:block}

.seg{display:flex;gap:8px;margin:4px 0 12px}
.seg button{flex:1;padding:9px 10px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:800 14px "Bricolage Grotesque",system-ui,sans-serif}
.seg button.on{background:#ffc93c;color:#15122e;border-color:#f4ecd8;box-shadow:3px 3px 0 #ff5c8a}
.ed{display:block;width:100%;background:var(--code);color:var(--codeink);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:600 14px/1.55 "JetBrains Mono",ui-monospace,monospace;tab-size:4;resize:vertical;white-space:pre;overflow:auto;margin-bottom:10px}
.ed:focus{outline:none;border-color:#ffc93c}
.ed.small{min-height:0;font-size:13px}
.cact{display:flex;gap:10px;align-items:center;margin:2px 0 12px;flex-wrap:wrap}
.cact small{color:var(--mute);margin-left:auto}
.cbtn{padding:10px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--card);color:var(--ink);font:800 14px "Bricolage Grotesque",system-ui,sans-serif}
.cbtn.run{background:#19c6b7;color:#06241a;border-color:#0f6a4e}
.cbtn:disabled{opacity:.5}
.cout{min-height:70px;white-space:pre-wrap;word-break:break-word;background:#0b1022!important;background-image:none!important;padding:14px 16px!important;border:2px solid var(--line)!important;margin-bottom:90px}
.cout.bad{color:#ff8fa3}.cout.good{color:#6fe8b0}

.pj .cout{margin-bottom:40px}
.bl{margin:0 0 14px;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--code)}

.bln.right{background:var(--okbg)}.bln.wrong{background:var(--badbg)}

.rn{flex:1;min-width:0;display:flex;flex-direction:column}.rn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rn small{color:var(--mute);font-size:12px}

.bad2{color:#ff8fa3}

.code{font-family:"JetBrains Mono",ui-monospace,monospace;background:#2a2350;padding:1px 8px;border-radius:6px;color:#ffc93c}
.bat{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:2px dashed #9b8cff;border-radius:14px;padding:10px 12px;margin-bottom:8px}

.bt .cout{margin-bottom:40px}

function prep(q){var c=Object.assign({},q);if(c.k==="mc"){var t=c.o[c.a];c.o=shuffle(c.o);c.a=c.o.indexOf(t)}return c}

/* ===== Accounts + cloud sync =====
   The app is gated behind login. Progress is still kept in localStorage first, then synced
   to the server in the background, so it keeps working when the connection drops. */
var API=(location.protocol==='http:'||location.protocol==='https:')?'':null;
var AC={token:null,user:null,mode:'boot',ok:null,sync:'',timer:null,retry:null,replace:false,busy:false,view:'home'};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
AC.token=lsGet('pypath_token');
try{AC.user=JSON.parse(lsGet('pypath_user')||'null')}catch(e){}

function acStore(){lsSet('pypath_token',AC.token);lsSet('pypath_user',AC.token?JSON.stringify(AC.user):null)}

function api(method,path,body){
  if(API===null)return Promise.reject(Object.assign(new Error('offline'),{offline:true}));
  var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},10000),h={'Content-Type':'application/json'};
  if(AC.token)h.Authorization='Bearer '+AC.token;
  return fetch(API+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined,signal:ctl.signal}).then(function(r){
    clearTimeout(to);
    return r.json().catch(function(){return{}}).then(function(j){
      if(!r.ok){var e=new Error(j.error||('Error '+r.status));e.status=r.status;e.info=j;
        if(r.status===401&&AC.token&&path.indexOf('/api/login')<0)acExpire(j.error);
        throw e}
      return j})
  },function(){clearTimeout(to);throw Object.assign(new Error('Cannot reach the server'),{offline:true})});
}

/* --- state helpers (the merge rules match the server: progress only ever grows) --- */
function acPayload(){return{progress:{xp:S.xp,streak:S.streak,last:S.last,course:S.course,dn:S.dn},extra:{from:X.from,ex:X.ex,t:X.t||0,profile:{gender:X.profile.gender,av:X.profile.av||{}}}}}
function dayVal(s){var t=Date.parse(s);return isNaN(t)?0:t}
function mergeEx(a,b){var r={},k={};a=a||{};b=b||{};Object.keys(a).concat(Object.keys(b)).forEach(function(x){k[x]=1});Object.keys(k).forEach(function(x){var u={};(a[x]||[]).concat(b[x]||[]).forEach(function(v){u[v]=1});r[x]=Object.keys(u)});return r}
function mergeState(a,b){
  if(!a)return b;
  var pa=a.progress,pb=b.progress,dn={},keys={};
  Object.keys(pa.dn||{}).concat(Object.keys(pb.dn||{})).forEach(function(k){keys[k]=1});
  Object.keys(keys).forEach(function(k){var u={};(pa.dn[k]||[]).concat(pb.dn[k]||[]).forEach(function(i){u[i]=1});dn[k]=Object.keys(u).map(Number).sort(function(x,y){return x-y})});
  var da=dayVal(pa.last),db=dayVal(pb.last);
  return{progress:{xp:Math.max(pa.xp,pb.xp),dn:dn,course:pb.course,last:db>=da?pb.last:pa.last,streak:db>da?pb.streak:da>db?pa.streak:Math.max(pa.streak,pb.streak)},extra:Object.assign({},(b.extra.t>a.extra.t?b.extra:a.extra.t>b.extra.t?a.extra:((b.extra.profile.gender||!a.extra.profile.gender)?b.extra:a.extra)),{ex:mergeEx(a.extra.ex,b.extra.ex)})};
}
function applyState(st,keepCourse){
  var p=st.progress,e=st.extra||{},pr=e.profile||{};
  S.xp=p.xp|0;S.streak=p.streak|0;S.last=p.last||'';
  S.dn=Object.assign({python:[],robotics:[]},p.dn||{});
  if(!keepCourse)S.course=p.course||'python';
  X.from=e.from||{};X.ex=e.ex&&typeof e.ex==='object'?e.ex:{};X.t=e.t||0;
  X.profile.gender=pr.gender==='f'||pr.gender==='m'?pr.gender:'';
  X.profile.av=X.profile.gender&&pr.av&&Object.keys(pr.av).length?pr.av:null;
  useCourse(S.course);
}
function resetLocal(){S.xp=0;S.streak=0;S.last='';S.dn={python:[],robotics:[]};X.from={};X.ex={};X.t=0;X.profile.gender='';X.profile.av=null;X.profile.name='';S.course='python';useCourse('python')}
function sig(){return JSON.stringify([S.xp,S.streak,S.dn,X.ex,X.profile.gender,X.profile.av,X.from])}
function setStatus(t){AC.sync=t;var e=document.getElementById('acStatus');if(e)e.textContent=t}
function refreshView(){if(L!==null||AC.mode!=='app')return;if(AC.view==='profile'&&!PF.pick)profile();else if(AC.view==='home')home()}

/* Called after login or on start-up with the server's copy of this user's data */
function acLink(j){
  var email=AC.user.email,owner=lsGet('pypath_owner');
  if(!X.t&&X.profile.gender)X.t=Date.now();   /* profile saved before accounts existed has no timestamp */
  if(owner&&owner!==email){            /* a different person used this device: never mix two accounts */
    if(j.state)applyState(j.state);else resetLocal();
  }else{                               /* same person, or old local progress from before accounts: keep it all */
    applyState(j.state?mergeState(j.state,acPayload()):acPayload(),true);
  }
  lsSet('pypath_owner',email);
  X.profile.name=AC.user.name.slice(0,20);
  _save();_saveX();
}
function acPull(){
  return api('GET','/api/state').then(function(j){
    AC.ok=true;if(j.user){AC.user=j.user;acStore()}
    var before=sig();acLink(j);if(sig()!==before)refreshView();
  }).catch(function(e){if(e.offline){AC.ok=false;setStatus('Offline: your progress is saved on this device')}})
}
function acPush(){
  if(!AC.token||AC.mode!=='app')return Promise.resolve();
  var body=acPayload(),rep=AC.replace;if(rep)body.replace=true;
  return api('PUT','/api/state',body).then(function(j){
    AC.ok=true;AC.replace=false;
    setStatus('Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
    if(!rep&&j.state){var before=sig();applyState(mergeState(j.state,acPayload()),true);_save();_saveX();if(sig()!==before)refreshView()}
  }).catch(function(e){
    if(e.offline){AC.ok=false;setStatus('Offline: will sync when the server is back');clearTimeout(AC.retry);AC.retry=setTimeout(acPush,30000)}
    else if(e.status!==401)setStatus('Sync problem: '+e.message)

}
function queueSync(){if(!AC.token||AC.mode!=='app')return;clearTimeout(AC.timer);AC.timer=setTimeout(acPush,1500)}
