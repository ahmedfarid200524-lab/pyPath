var SO={d:null,seg:'lb',badge:0,prev:{},seenReq:{},seenInv:{},first:true,owner:'',sig:'',msg:'',poll:null,ch:null};
var BT=null;
var LVN={easy:'Easy',medium:'Medium',hard:'Hard'},LGN={py:'Python',js:'JavaScript'};
function avMini(g,av){return g?'<span class="mav">'+avRender(g,avClean(av,g),{vb:'36 20 168 168',bg:'#6d6a68'})+'</span>':'<span class="mav">👤</span>'}
function toastX(msg,fn){
  var o=document.querySelector('.xtoast');if(o)o.remove();
  var d=document.createElement('button');d.className='xtoast';d.textContent=msg;d.onclick=function(){d.remove();if(fn)fn()};
  document.body.appendChild(d);setTimeout(function(){if(d.parentNode)d.remove()},7000);
}
function soOwner(){var e=AC.user?AC.user.email:'';if(SO.owner!==e){SO.owner=e;SO.d=null;SO.sig='';SO.prev={};SO.seenReq={};SO.seenInv={};SO.first=true;SO.badge=0}}
function soBadgeOf(d){
  var n=d.incoming.length;
  d.battles.forEach(function(b){if(b.status==='active'||(b.status==='pending'&&b.b.id===d.me.id))n++});
  return n;
}
function soSetBadge(n){
  SO.badge=n;
  [].forEach.call(document.querySelectorAll('.nav .bdg,#sgFr .bdg'),function(e){e.remove()});
  var nv=document.querySelector('.nav button.rk-tab'),fr=document.getElementById('sgFr');
  if(n&&nv)nv.insertAdjacentHTML('beforeend','<i class="bdg">'+n+'</i>');
  if(n&&fr)fr.insertAdjacentHTML('beforeend','<i class="bdg">'+n+'</i>');
}
/* take new data from the server: update badge, show toasts, auto-open a battle the friend accepted */
function soIngest(d){
  soOwner();
  var me=d.me.id,pend={};
  d.battles.forEach(function(b){if(b.status==='pending'&&b.a.id===me)pend[b.id]=1});
  if(!SO.first){
    d.incoming.forEach(function(f){if(!SO.seenReq[f.id])toastX('👥 '+f.name+' sent you a friend request',function(){socialScreen('fr')})});
    d.battles.forEach(function(b){
      if(b.status==='pending'&&b.b.id===me&&!SO.seenInv[b.id])toastX('⚔️ '+b.a.name+' challenged you to a coding battle',function(){socialScreen('fr')});
      if(b.status==='active'&&SO.prev[b.id]&&!(BT&&BT.id===b.id)){
        if(AC.view==='ranks')battleOpen(b.id);else toastX('⚔️ '+b.b.name+' accepted — the battle is starting',function(){battleOpen(b.id)});
      }
    });
  }
  d.incoming.forEach(function(f){SO.seenReq[f.id]=1});
  d.battles.forEach(function(b){SO.seenInv[b.id]=1});
  SO.prev=pend;SO.first=false;SO.d=d;SO.msg='';soSetBadge(soBadgeOf(d));
}
function soLoad(force){
  return api('GET','/api/social').then(function(d){
    var sig=JSON.stringify(d);soIngest(d);
    if(AC.view==='ranks'&&(force||sig!==SO.sig)){SO.sig=sig;soDraw()}
  }).catch(function(e){
    SO.msg=e.offline?'You are offline. The leaderboard and friends need a connection.':(e.message||'Something went wrong');
    if(AC.view==='ranks')soDraw();
  });
}
function soPoll(){if(AC.token&&AC.mode==='app'&&!document.hidden&&AC.view!=='ranks'&&AC.view!=='battle')api('GET','/api/social').then(soIngest).catch(function(){})}
var soTick=0;
setInterval(function(){soTick++;if(Object.keys(SO.prev).length||soTick%7===0)soPoll()},3000);   /* quick while waiting for a friend to accept, slow otherwise */
setTimeout(soPoll,4000);

function socialScreen(seg){
  btStop();L=null;AC.view='ranks';if(seg)SO.seg=seg;soOwner();
  app.innerHTML='<div class="top"><div class="logo">Ranks &amp; <i>friends</i></div></div>'+
   '<div class="seg" role="tablist"><button id="sgLb" onclick="soSeg(\'lb\')">🏆 Leaderboard</button><button id="sgFr" onclick="soSeg(\'fr\')">👥 Friends</button></div>'+
   '<div id="soBody"><p class="lead">Loading…</p></div>'+nav('ranks');
  soSetBadge(SO.badge);soSegMark();soDraw();soLoad(true);
  clearInterval(SO.poll);SO.poll=setInterval(function(){if(AC.view==='ranks'&&!document.hidden)soLoad()},2500);
  window.scrollTo(0,0);
}
function soSegMark(){var a=elx('sgLb'),b=elx('sgFr');if(a){a.className=SO.seg==='lb'?'on':'';b.className=SO.seg==='fr'?'on':''}}
function soSeg(s){SO.seg=s;soSegMark();soDraw()}
function soErr(e){toastX(e&&e.offline?'You are offline':(e&&e.message)||'Something went wrong')}
function soFriend(act,id){
  if(act==='remove'&&!confirm('Remove this friend?'))return;
  api('POST','/api/friends',{action:act,id:id}).then(function(){return soLoad(true)}).catch(soErr);
}
function soAddCode(){
  var v=(elx('soCode').value||'').trim().toLowerCase();if(!v)return;
  api('POST','/api/friends',{action:'request',id:v}).then(function(){elx('soCode').value='';toastX('Friend request sent');return soLoad(true)}).catch(function(e){toastX(e.status===404?'No player with that code':(e.message||'Error'))});
}
function relBtn(x){
  if(x.rel==='me')return '<span class="you">You</span>';
  if(x.rel==='friend')return '<span class="ok2">👥 Friends</span>';
  if(x.rel==='out')return '<span class="mute2">Sent</span>';
  if(x.rel==='in')return '<button class="mini go2" onclick="soFriend(\'accept\',\''+x.id+'\')">Accept</button>';
  return '<button class="mini" onclick="soFriend(\'request\',\''+x.id+'\')">+ Add</button>';
}
function pRow(x,right,extra){
  return '<div class="rw'+(x.rel==='me'?' me':'')+'">'+(extra||'')+avMini(x.g,x.av)+'<span class="rn"><b>'+esc(x.name)+'</b><small>🔥 '+x.streak+' · ✓ '+x.levels+' levels</small></span><span class="rx">⭐ '+x.xp+'</span>'+(right||'')+'</div>';
}
function bRow(b,me){
  var inc=b.b.id===me,opp=inc?b.a:b.b,info=LGN[b.lang]+' · '+LVN[b.level];
  if(b.status==='pending')return inc
    ?'<div class="bat"><div><b>⚔️ '+esc(opp.name)+' challenges you</b><small>'+info+' · friendly, no points</small></div><div class="bact"><button class="mini go2" onclick="btAct(\'accept\',\''+b.id+'\')">Accept</button><button class="mini" onclick="btAct(\'decline\',\''+b.id+'\')">Decline</button></div></div>'
    :'<div class="bat"><div><b>Waiting for '+esc(opp.name)+'…</b><small>'+info+'</small></div><div class="bact"><button class="mini" onclick="btAct(\'cancel\',\''+b.id+'\')">Cancel</button></div></div>';
  if(b.status==='active')return '<div class="bat live"><div><b>⚔️ Battle with '+esc(opp.name)+'</b><small>'+info+'</small></div><div class="bact"><button class="mini go2" onclick="battleOpen(\''+b.id+'\')">Open</button></div></div>';
  var msg=b.winner===me?'🏆 You won against '+esc(opp.name):b.winner?esc(opp.name)+' won this battle':'Battle ended';
  return '<div class="bat"><div><b>'+msg+'</b><small>'+info+'</small></div><div class="bact"><button class="mini" onclick="battleOpen(\''+b.id+'\')">View</button></div></div>';
}
function soDraw(){
  var el=elx('soBody');if(!el)return;
  var keep=elx('soCode')?elx('soCode').value:'',d=SO.d,h='';
  if(!d){el.innerHTML='<p class="lead">'+esc(SO.msg||'Loading…')+'</p>';return}
  if(SO.msg)h+='<p class="lead bad2">'+esc(SO.msg)+'</p>';
  if(SO.seg==='lb'){
    h+='<div class="rankbox"><span>Your rank</span><b>#'+d.me.rank+'</b><small>of '+(d.lb.length>=100?'100+':d.lb.length)+' players · ⭐ '+d.me.xp+' XP</small></div>';
    h+=d.lb.map(function(x){var m=x.rank===1?'🥇':x.rank===2?'🥈':x.rank===3?'🥉':x.rank;return pRow(x,relBtn(x),'<span class="rkn">'+m+'</span>')}).join('');
    if(d.lb.length<2)h+='<p class="lead">You are the first player. Invite your friends to join pyPath!</p>';
  }else{
    if(d.battles.length)h+='<div class="kick">Battles</div>'+d.battles.map(function(b){return bRow(b,d.me.id)}).join('');
    h+='<div class="kick">Add a friend</div><div class="addf"><input class="fin" id="soCode" placeholder="Friend code" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')soAddCode()"><button class="cbtn run" onclick="soAddCode()">Add</button></div><p class="lead">Your code: <b class="code">'+esc(d.me.id)+'</b> — share it with friends, or tap “+ Add” on the leaderboard.</p>';
    if(d.incoming.length)h+='<div class="kick">Friend requests</div>'+d.incoming.map(function(x){return pRow(x,'<button class="mini go2" onclick="soFriend(\'accept\',\''+x.id+'\')">Accept</button><button class="mini" onclick="soFriend(\'decline\',\''+x.id+'\')">✕</button>')}).join('');
    if(d.outgoing.length)h+='<div class="kick">Sent requests</div>'+d.outgoing.map(function(x){return pRow(x,'<button class="mini" onclick="soFriend(\'cancel\',\''+x.id+'\')">Cancel</button>')}).join('');
    h+='<div class="kick">Your friends ('+d.friends.length+')</div>';
    h+=d.friends.length?d.friends.map(function(x){return pRow(x,'<button class="mini go2" onclick="soChallenge(\''+x.id+'\')">⚔️ Challenge</button><button class="mini" aria-label="Remove friend" onclick="soFriend(\'remove\',\''+x.id+'\')">✕</button>')}).join(''):'<p class="lead">No friends yet. Add someone from the leaderboard or with their code.</p>';
  }
  el.innerHTML=h;
  var c=elx('soCode');if(c&&keep)c.value=keep;
}

/* ---- challenge dialog ---- */
function soChallenge(id){
  var d=SO.d,f=d&&d.friends.filter(function(x){return x.id===id})[0];if(!f)return;
  SO.ch={id:id,name:f.name,level:'easy',lang:'py'};chDraw(true);
}
function chDraw(open){
  var c=SO.ch,o=document.querySelector('.ov.chov');
  if(!o){if(!open)return;o=document.createElement('div');o.className='ov chov';document.body.appendChild(o)}
  function seg(list,key,names){return '<div class="seg">'+list.map(function(k){return '<button class="'+(c[key]===k?'on':'')+'" onclick="SO.ch.'+key+'=\''+k+'\';chDraw()">'+names[k]+'</button>'}).join('')+'</div>'}
  var desc={easy:'Beginner problems: if/else, simple loops.',medium:'Lists, strings and loops together.',hard:'Trickier logic. Be ready to think.'};
  o.innerHTML='<h2 style="margin:0">Challenge '+esc(c.name)+'</h2><p>A friendly coding battle: first to pass all the tests wins. Nobody gets points for winning.</p><div class="kick">Difficulty</div>'+seg(['easy','medium','hard'],'level',LVN)+'<p class="lead">'+desc[c.level]+'</p><div class="kick">Language</div>'+seg(['py','js'],'lang',{py:'🐍 Python',js:'🟨 JavaScript'})+'<button class="go" onclick="chSend()">Send challenge</button><button class="reset" onclick="this.parentNode.remove()">Cancel</button>';
}
function chSend(){
  var c=SO.ch,base={easy:0,medium:6,hard:12}[c.level],p=base+Math.floor(Math.random()*6);
  api('POST','/api/battles',{action:'invite',to:c.id,lang:c.lang,level:c.level,p:p}).then(function(){
    var o=document.querySelector('.ov.chov');if(o)o.remove();toastX('Challenge sent to '+c.name);soLoad(true);
  }).catch(function(e){soErr(e)});
}
function btAct(act,bid){
  api('POST','/api/battles',{action:act,bid:bid}).then(function(j){
    if(act==='accept')battleOpen(bid);else soLoad(true);
  }).catch(function(e){soErr(e);soLoad(true)});
}

/* ---- the battle ---- */
function btStop(){if(BT){clearInterval(BT.poll);clearInterval(BT.tick);}BT=null}
function battleOpen(bid){
  btStop();L=null;AC.view='battle';clearInterval(SO.poll);
  var tt=document.querySelector('.xtoast');if(tt)tt.remove();
  BT={id:bid,v:null,me:'',off:0,phase:'',busy:false,lang:'py',poll:null,tick:null,res:null};
  app.innerHTML='<div class="end"><p class="lead">Opening battle…</p></div>';
  btFetch().then(function(){if(!BT)return;BT.poll=setInterval(btFetch,1500);BT.tick=setInterval(btTick,250)});
}
function btFetch(){
  var bt=BT;if(!bt)return Promise.resolve();
  return api('GET','/api/battle?id='+encodeURIComponent(bt.id)).then(function(j){if(BT===bt)btGot(j)}).catch(function(e){
    if(BT===bt&&!e.offline&&e.status===404){btBack();toastX('That battle is no longer available')}
  });
}
function btGot(j){BT.v=j.battle;BT.me=j.me;BT.off=j.battle.now-Date.now();BT.lang=j.battle.lang;btUpdate()}
function btNow(){return Date.now()+BT.off}
function btPhaseOf(v){
  if(v.status==='pending')return 'wait';
  if(v.status==='active')return btNow()<v.startAt?'count':'play';
  return 'over';
}
function btUpdate(){
  if(!BT||!BT.v)return;
  var ph=btPhaseOf(BT.v);
  if(ph!==BT.phase){BT.phase=ph;btRender()}else btTick();
}
function btOpp(){var v=BT.v;return v.a.id===BT.me?v.b:v.a}
function btMe(){var v=BT.v;return v.a.id===BT.me?v.a:v.b}
function btHead(extra){
  var v=BT.v,m=btMe(),o=btOpp();
  return '<div class="bar"><button class="x" onclick="btLeave()" aria-label="Leave">✕</button><div class="vs">'+avMini(m.g,m.av)+'<b>You</b><span>vs</span>'+avMini(o.g,o.av)+'<b>'+esc(o.name)+'</b></div>'+(extra||'')+'</div>';
}
function btRender(){
  var v=BT.v,ph=BT.phase,o=btOpp(),info=LGN[v.lang]+' · '+LVN[v.level],h;
  if(ph==='wait'){
    var inc=v.b.id===BT.me;
    h='<div class="lesson">'+btHead()+'<div class="end"><div class="big">⚔️</div><h1>'+(inc?esc(o.name)+' challenges you':'Waiting for '+esc(o.name))+'</h1><p class="lead">'+info+' · friendly battle, no points</p>'+
      (inc?'<div class="row"><button class="go" onclick="btAct(\'accept\',\''+v.id+'\')">Accept</button></div><button class="reset" onclick="btAct(\'decline\',\''+v.id+'\');btBack()">Decline</button>'
          :'<button class="reset" onclick="btAct(\'cancel\',\''+v.id+'\');btBack()">Cancel challenge</button>')+'</div></div>';
    app.innerHTML=h;return;
  }
  if(ph==='count'){
    app.innerHTML='<div class="lesson">'+btHead()+'<div class="end"><p class="lead">'+info+'</p><h1>Get ready…</h1><div class="big cdn" id="btCd">3</div></div></div>';btTick();return;
  }
  if(ph==='play'){
    var pr=BANK[v.p],ex=pr.tests.slice(0,2).map(function(t){return pr.fn+'('+t[0].map(function(a){return JSON.stringify(a)}).join(', ')+')  →  '+JSON.stringify(t[1])}).join('\n');
    var draft=lsGet('pypath_bt_'+v.id+'_'+v.lang);if(draft===null)draft=pr[v.lang];
    app.innerHTML='<div class="lesson bt">'+btHead('<span class="hp" id="btTime">0:00</span>')+
      '<div class="chs"><span>'+info+'</span><span>Friendly · no points</span></div><h2>'+esc(pr.t)+'</h2>'+paras(fmt(pr.d).replace(/\n/g,' '))+
      '<pre class="ex">'+esc(ex)+'</pre>'+edHTML('btCode',draft,12)+
      '<div class="cact"><button class="cbtn run" id="btRun" onclick="btRun()">▶ Run tests</button><small>Ctrl + Enter</small></div>'+
      '<div class="oppb" id="btOppB"></div><pre class="cout" id="btOut" aria-live="polite">Pass every test before '+esc(o.name)+' does.</pre></div>';
    var ta=elx('btCode');ta.addEventListener('input',function(){lsSet('pypath_bt_'+v.id+'_'+v.lang,ta.value)});
    btTick();return;
  }
  /* over */
  var me=BT.me,won=v.winner===me,t,sub;
  if(v.status==='done'){t=won?'You won! 🏆':esc(o.name)+' solved it first';sub=won?'You passed every test first. Friendly battle — no points, just bragging rights.':'Good fight! Try again or review the problem. No points were at stake.'}
  else if(v.status==='left'){t=v.left===me?'You left the battle':esc(o.name)+' left the battle';sub=v.left===me?'No points were lost.':'You win by default. No points are given for friendly battles.'}
  else if(v.status==='expired'){t='Time is up';sub='Nobody solved it within 20 minutes.'}
  else if(v.status==='declined'){t='Challenge declined';sub=''}
  else{t='Battle cancelled';sub=''}
  app.innerHTML='<div class="lesson">'+btHead()+'<div class="end"><div class="big">'+(v.status==='done'&&won?'🏆':v.status==='done'?'💪':'⚔️')+'</div><h1>'+t+'</h1><p class="lead">'+sub+'</p><div class="row"><span class="pill">'+LGN[v.lang]+'</span><span class="pill">'+LVN[v.level]+'</span></div><button class="go" onclick="btBack()">Back to friends</button></div></div>';
}
function bar(n,t){var p=t?Math.round(n/t*100):0;return '<span class="pb"><i style="width:'+p+'%"></i></span>'}
function btTick(){
  if(!BT||!BT.v)return;
  var v=BT.v;
  if(BT.phase==='count'){
    var left=Math.ceil((v.startAt-btNow())/1000),c=elx('btCd');
    if(left<=0){btUpdate();return}
    if(c)c.textContent=left;return;
  }
  if(BT.phase==='play'){
    var el=btNow()-v.startAt,rem=Math.max(0,20*60e3-el),s=Math.floor(rem/1000),t=elx('btTime');
    if(t)t.textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2);
    var o=btOpp(),pm=v.prog[BT.me]||{passed:0,total:0},po=v.prog[o.id]||{passed:0,total:0},tot=BANK[v.p].tests.length,b=elx('btOppB');
    if(b)b.innerHTML='<div><span>You</span>'+bar(pm.passed,tot)+'<em>'+pm.passed+'/'+tot+'</em></div><div><span>'+esc(o.name)+'</span>'+bar(po.passed,tot)+'<em>'+po.passed+'/'+tot+'</em></div>';
  }
}
function btRun(){
  if(!BT||BT.busy||BT.phase!=='play'||!elx('btCode'))return;
  var v=BT.v,pr=BANK[v.p],bt=BT,o=elx('btOut'),b=elx('btRun'),code=elx('btCode').value,tests,msg;
  var lit=function(x){return JSON.stringify(x)};
  if(v.lang==='py')tests=pr.tests.map(function(t,i){return{label:'Test '+(i+1)+': '+pr.fn+'('+t[0].map(lit).join(', ')+')',e:pr.fn+'('+t[0].map(lit).join(', ')+')',x:lit(t[1])}});
  else tests=pr.tests.map(function(t,i){return{label:'Test '+(i+1)+': '+pr.fn+'('+t[0].map(lit).join(', ')+')',args:t[0],want:t[1]}});
  bt.busy=true;b.disabled=true;o.className='cout';o.textContent=v.lang==='py'&&!WK.py?'Loading Python… the first run takes a few seconds.':'Running tests…';
  runJob(v.lang,{kind:'tests',code:code,tests:tests,fn:pr.fn},10000).then(function(r){
    bt.busy=false;if(BT!==bt)return;
    var b2=elx('btRun');if(b2)b2.disabled=false;var o2=elx('btOut');
    if(!r.res){if(o2)showOut(o2,{out:'',err:r.err||'Something went wrong.'});return}
    var ok=r.res.filter(function(x){return x.ok}).length,all=ok===r.res.length,first=r.res.filter(function(x){return!x.ok})[0];
    if(o2){o2.className='cout'+(all?' good':' bad');o2.textContent=all?'All '+ok+' tests passed! Sending your result…':ok+' of '+r.res.length+' tests passed.'+(first?'\n\nFirst problem — '+first.msg:'')}
    api('POST','/api/battles',{action:'progress',bid:v.id,passed:ok,total:r.res.length}).then(function(j){if(BT===bt)btGot(j)}).catch(function(){});
  });
}
function btLeave(){
  if(!BT)return;
  var ph=BT.phase,id=BT.id;
  if(ph==='play'||ph==='count'){if(!confirm('Leave the battle? Your friend wins by default.'))return;api('POST','/api/battles',{action:'leave',bid:id}).catch(function(){})}
  btBack();
}
function btBack(){btStop();socialScreen('fr')}

useCourse(S.course);
boot();
</script>
